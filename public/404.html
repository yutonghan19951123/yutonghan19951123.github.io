<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname;

      // If the URL ends with .pdf. (trailing dot), redirect to the correct .pdf URL
      if (/\.pdf\.$/.test(path)) {
        window.location.replace(
          window.location.origin + path.slice(0, -1)
        );
        return;
      }

      // All other 404s → home page
      window.location.replace('https://yutonghan19951123.github.io/');
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
